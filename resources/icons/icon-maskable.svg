<!-- The maskable icon (spec 7.1): the same crest and the same field as
     resources/icons/icon.svg, drawn smaller. A launcher may crop a maskable
     icon to any shape inside the centre 80%, so the crest is sized to fit that
     circle (255 by 300 has a corner 196.9px from the centre, inside the
     204.8px safe radius) and the green runs to the edges so no crop shows a
     corner.

     Rasterised to public/icon-maskable-512.png by scripts/icons.sh, which
     renders all four. Change the crest, change this and
     resources/icons/icon.svg with it (spec 8.3.5). -->
<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="512" height="512" fill="#051D0E"/>
  <g transform="translate(128.5 106) scale(7.5)">
    <path d="M2 2h30v22c0 8-9 12-15 14-6-2-15-6-15-14V2z" fill="#6D1B20" stroke="#E0C482" stroke-width="1.8"/>
    <path d="M2 15l15 7 15-7" stroke="#E0C482" stroke-width="1.6" fill="none"/>
    <text x="17" y="13" text-anchor="middle" fill="#E0C482" font-family="Georgia, serif" font-size="9.5" letter-spacing="1">HA</text>
  </g>
</svg>
