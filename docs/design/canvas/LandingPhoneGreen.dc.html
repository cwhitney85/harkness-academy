<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,400&family=Instrument+Serif:ital@0;1&family=Caveat:wght@500;600&display=swap">
  <style>
    :root{
      --ground:oklch(0.962 0.010 95); --surface:oklch(0.988 0.006 95);
      --ink:oklch(0.24 0.028 155); --muted:oklch(0.50 0.020 145);
      --hunter:oklch(0.34 0.075 155); --railgreen:oklch(0.205 0.042 155);
      --wine:oklch(0.36 0.115 22); --brass:oklch(0.70 0.110 82);
      --gold:oklch(0.83 0.090 88); --rule:oklch(0.87 0.012 95);
      --desk:oklch(0.938 0.014 95);
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--ground);color:var(--ink);
      font-family:"Newsreader",Georgia,serif;font-size:17px;line-height:1.62;-webkit-font-smoothing:antialiased}
    a{color:var(--wine)} a:hover{color:oklch(0.30 0.125 22)}
    .disp{font-family:"Instrument Serif",Georgia,serif;font-weight:400;letter-spacing:-0.008em}
    .lab{font-size:11.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}
    .hand{font-family:"Caveat",cursive;font-size:21px;line-height:1.3;color:var(--wine)}
    /* W3: stacked letterspaced caps. The negative right margin gives back the
       trailing letter-space so the block optically centres. */
    .w3{font-family:"Instrument Serif",Georgia,serif;text-transform:uppercase;
      letter-spacing:.30em;margin-right:-.30em;line-height:1.12}
    .btn{font-family:"Newsreader",Georgia,serif;font-size:15px;letter-spacing:.13em;
      text-transform:uppercase;background:var(--wine);color:oklch(0.97 0.010 60);
      border:none;padding:13px 30px;cursor:pointer}
    .btn-quiet{background:none;color:var(--wine);border:1px solid var(--rule);padding:12px 28px}
  </style>
</helmet>

<div style="width:390px; height:844px">
  <div style="width:390px; height:844px; background:var(--railgreen); color:oklch(0.95 0.012 100); display:flex; flex-direction:column">

    <div style="display:flex; align-items:center; gap:8px; padding:16px 20px; border-bottom:1px solid oklch(0.32 0.045 155)">
      <svg width="18" height="21" viewBox="0 0 34 40" fill="none" style="flex:0 0 18px">
        <path d="M2 2h30v22c0 8-9 12-15 14-6-2-15-6-15-14V2z" fill="var(--wine)" stroke="var(--gold)" stroke-width="2.2"/>
        <path d="M2 15l15 7 15-7" stroke="var(--gold)" stroke-width="2" fill="none"/>
        <text x="17" y="13" text-anchor="middle" fill="var(--gold)" font-family="Georgia,serif" font-size="10" letter-spacing="0.6">HA</text>
      </svg>
      <div class="disp" style="font-size:16px; line-height:1; color:oklch(0.95 0.012 100)">Harkness Academy</div>
      <div style="flex-grow:1"></div>
      <div class="lab" style="color:oklch(0.72 0.028 130); font-size:10px">Log in</div>
      <div class="lab" style="color:var(--brass); font-size:10px; margin-left:14px">Register</div>
    </div>

    <div style="flex-grow:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:0 20px 56px">

      <svg width="118" height="114" viewBox="0 0 60 58" fill="none" style="margin-bottom:24px">
        <path d="M15 2h30v22c0 8-9 12-15 14-6-2-15-6-15-14V2z" fill="var(--wine)" stroke="var(--gold)" stroke-width="1.8"/>
        <path d="M15 15l15 7 15-7" stroke="var(--gold)" stroke-width="1.6" fill="none"/>
        <text x="30" y="13" text-anchor="middle" fill="var(--gold)" font-family="Georgia,serif" font-size="9.5" letter-spacing="1">HA</text>
        <path d="M2 42h56v11H2z" fill="var(--wine)"/>
        <path d="M2 42h56M2 53h56" stroke="var(--gold)" stroke-width="0.9"/>
        <text x="30" y="50.1" text-anchor="middle" fill="var(--gold)" font-family="Georgia,serif" font-size="6.3" letter-spacing="0.85">LICET FACERE</text>
      </svg>

      <div class="disp" style="font-size:36px; line-height:1.02; color:oklch(0.95 0.012 100)">Harkness Academy</div>

      <p style="margin:18px 0 0; font-size:17px; line-height:1.58; color:oklch(0.72 0.028 130)">
        A tutor that interviews you, writes a syllabus you approve, teaches it lesson by lesson, and examines you at the end.
      </p>

      <button class="btn" style="width:100%; margin-top:30px; padding:15px 0; box-shadow:inset 0 0 0 1px var(--gold);">Enroll yourself</button>
      <button class="btn btn-quiet" style="width:100%; margin-top:10px; padding:14px 0; border-color:oklch(0.32 0.045 155); color:oklch(0.95 0.012 100)">Log in</button>

      <div class="lab" style="margin-top:18px; color:oklch(0.72 0.028 130); font-size:10.5px">Registration needs an invitation code</div>
    </div>

    <div style="padding:16px 20px 22px; border-top:1px solid oklch(0.32 0.045 155); display:flex; align-items:center; gap:12px">
      <span style="font-size:10px; letter-spacing:.32em; text-transform:uppercase; color:var(--brass)">Licet Facere</span>
      <span style="height:1px; flex-grow:1; background:oklch(0.32 0.045 155)"></span>
      <span class="lab" style="color:oklch(0.72 0.028 130); font-size:9.5px">G2 green</span>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
