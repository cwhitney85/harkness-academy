<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,400&family=Instrument+Serif:ital@0;1&family=Caveat:wght@500;600&display=swap">
  <style>
    :root{
      --ground:oklch(0.962 0.010 95); --surface:oklch(0.988 0.006 95);
      --ink:oklch(0.24 0.028 155); --muted:oklch(0.50 0.020 145);
      --hunter:oklch(0.34 0.075 155); --railgreen:oklch(0.205 0.042 155);
      --wine:oklch(0.36 0.115 22); --brass:oklch(0.70 0.110 82);
      --gold:oklch(0.83 0.090 88); --rule:oklch(0.87 0.012 95);
      --desk:oklch(0.938 0.014 95);
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--ground);color:var(--ink);
      font-family:"Newsreader",Georgia,serif;font-size:17px;line-height:1.62;-webkit-font-smoothing:antialiased}
    a{color:var(--wine)} a:hover{color:oklch(0.30 0.125 22)}
    .disp{font-family:"Instrument Serif",Georgia,serif;font-weight:400;letter-spacing:-0.008em}
    .lab{font-size:11.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}
    .hand{font-family:"Caveat",cursive;font-size:21px;line-height:1.3;color:var(--wine)}
    /* W3: stacked letterspaced caps. The negative right margin gives back the
       trailing letter-space so the block optically centres. */
    .w3{font-family:"Instrument Serif",Georgia,serif;text-transform:uppercase;
      letter-spacing:.30em;margin-right:-.30em;line-height:1.12}
    .btn{font-family:"Newsreader",Georgia,serif;font-size:15px;letter-spacing:.13em;
      text-transform:uppercase;background:var(--wine);color:oklch(0.97 0.010 60);
      border:none;padding:13px 30px;cursor:pointer}
    .btn-quiet{background:none;color:var(--wine);border:1px solid var(--rule);padding:12px 28px}
  </style>
</helmet>

<div style="width:1440px; height:420px; display:flex; flex-direction:column">

  <!-- The three candidate grounds, so the join to the footer is visible whichever wins -->
  <div style="display:flex; height:56px">
    <div style="flex:1; background:var(--ground); display:flex; align-items:center; padding-left:56px"><span class="lab" style="font-size:10px">G1 paper</span></div>
    <div style="flex:1; background:var(--railgreen); display:flex; align-items:center; padding-left:24px"><span class="lab" style="font-size:10px; color:oklch(0.62 0.026 130)">G2 green</span></div>
    <div style="flex:1; background:var(--desk); display:flex; align-items:center; padding-left:24px"><span class="lab" style="font-size:10px">G3 desk</span></div>
  </div>

  <!-- THE FOOTER — one base under any of them -->
  <div style="flex-grow:1; background:var(--railgreen); color:oklch(0.78 0.026 130); padding:44px 56px 34px; display:flex; flex-direction:column">

    <div style="display:flex; align-items:flex-start; gap:20px">
      <svg width="30" height="36" viewBox="0 0 34 40" fill="none" style="flex:0 0 30px">
        <path d="M2 2h30v22c0 8-9 12-15 14-6-2-15-6-15-14V2z" fill="oklch(0.36 0.115 22)" stroke="oklch(0.83 0.090 88)" stroke-width="1.8"/>
        <path d="M2 15l15 7 15-7" stroke="oklch(0.83 0.090 88)" stroke-width="1.6" fill="none"/>
        <text x="17" y="13" text-anchor="middle" fill="oklch(0.86 0.090 88)" font-family="Georgia,serif" font-size="9.5" letter-spacing="1">HA</text>
      </svg>

      <div style="flex-grow:1">
        <div class="disp" style="font-size:25px; line-height:1; color:oklch(0.95 0.012 100)">Harkness Academy</div>
        <div style="display:flex; align-items:center; gap:13px; margin-top:11px">
          <span style="font-size:11.5px; letter-spacing:.34em; text-transform:uppercase; color:var(--brass)">Licet Facere</span>
          <span style="height:1px; width:110px; background:oklch(0.36 0.048 155)"></span>
        </div>
      </div>

      <div style="display:flex; gap:52px">
        <div style="display:flex; flex-direction:column; gap:11px">
          <div class="lab" style="color:var(--gold); font-size:10px">Get in</div>
          <div style="font-size:15.5px">Log in</div>
          <div style="font-size:15.5px">Register</div>
        </div>
        <div style="display:flex; flex-direction:column; gap:11px">
          <div class="lab" style="color:var(--gold); font-size:10px">Read</div>
          <div style="font-size:15.5px">Terms</div>
          <div style="font-size:15.5px">Put it on your phone</div>
        </div>
      </div>
    </div>

    <div style="margin-top:auto; border-top:1px solid oklch(0.30 0.042 155); padding-top:18px; display:flex; align-items:baseline; gap:20px">
      <div class="lab" style="color:oklch(0.56 0.022 130); font-size:10.5px">© 2026 Harkness Academy</div>
      <div style="flex-grow:1"></div>
      <div class="lab" style="color:oklch(0.56 0.022 130); font-size:10.5px">You must be 18 or older to register</div>
    </div>

  </div>
</div>
</x-dc>
</body>
</html>
